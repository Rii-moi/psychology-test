                ]
            },
            {
                text: "周末你更倾向于怎么度过？",
                options: [
                    { text: "宅家追剧打游戏", score: 2 },
                    { text: "约朋友出去逛街探店", score: 1 },
                    { text: "一个人去图书馆/咖啡馆", score: 3 },
                    { text: "在家整理房间、做计划", score: 4 }
                ]
            },
            {
                text: "遇到挫折时，你通常会？",
                options: [
                    { text: "大哭一场发泄情绪", score: 1 },
                    { text: "找朋友倾诉", score: 2 },
                    { text: "自己消化，不想麻烦别人", score: 3 },
                    { text: "冷静分析原因，制定解决方案", score: 4 }
                ]
            },
            {
                text: "对于未来，你的态度是？",
                options: [
                    { text: "充满期待，觉得一切皆有可能", score: 1 },
                    { text: "有点焦虑，但还是会努力", score: 2 },
                    { text: "顺其自然，走一步看一步", score: 3 },
                    { text: "有清晰规划，按部就班执行", score: 4 }
                ]
            },
            {
                text: "和朋友聊天时，你更多扮演什么角色？",
                options: [
                    { text: "吐槽担当，一起抱怨生活", score: 2 },
                    { text: "倾听者，听别人说完", score: 3 },
                    { text: "开心果，负责活跃气氛", score: 1 },
                    { text: "理性分析，给出建议", score: 4 }
                ]
            },
            {
                text: "看到感人的电影情节，你会？",
                options: [
                    { text: "当场落泪，情绪完全代入", score: 1 },
                    { text: "眼眶微湿，但不会哭出来", score: 2 },
                    { text: "内心触动，但表面平静", score: 3 },
                    { text: "理性分析导演的拍摄手法", score: 4 }
                ]
            },
            {
                text: "购物时你更看重？",
                options: [
                    { text: "颜值和潮流", score: 1 },
                    { text: "品牌和质量", score: 2 },
                    { text: "性价比和实用性", score: 3 },
                    { text: "长期价值和耐用度", score: 4 }
                ]
            },
            {
                text: "面对一个新挑战，你的第一反应？",
                options: [
                    { text: "兴奋！想立刻尝试", score: 1 },
                    { text: "有点紧张，但愿意试试", score: 2 },
                    { text: "先查资料做准备", score: 3 },
                    { text: "评估风险和投入产出比", score: 4 }
                ]
            }
        ];

        const results = [
            {
                min: 8, max: 14,
                age: "15-20岁",
                emoji: "🌱",
                desc: "你的心理年龄非常年轻！你保持着对世界的好奇和热情，像一棵正在茁壮成长的幼苗。你敢于表达情绪，不掩饰自己的喜怒哀乐，这种真实非常珍贵。",
                advice: "保持这份纯真，但也试着在重要决定前多思考一下。成长不是坏事，你可以慢慢学会在热情和理性之间找到平衡。"
            },
            {
                min: 15, max: 20,
                age: "21-28岁",
                emoji: "🌸",
                desc: "你的心理年龄正处于最美好的年华。你有年轻人的活力，也开始懂得责任和规划。你能在感性和理性之间切换，这是很多人羡慕的能力。",
                advice: "你已经在正确的路上了。继续探索世界，但也别忘了偶尔停下来问问自己：这真的是你想要的吗？"
            },
            {
                min: 21, max: 26,
                age: "29-38岁",
                emoji: "🍂",
                desc: "你的心理年龄比实际年龄更成熟。你可能经历过一些事，让你学会了内敛和思考。你习惯把情绪藏起来，遇事先考虑后果，这种沉稳是你的保护伞。",
                advice: "成熟是好事，但别忘了你心里还住着一个孩子。偶尔允许自己任性一下、哭一场、或者什么都不做，这不是软弱，是对自己的温柔。"
            },
            {
                min: 27, max: 32,
                age: "39-50岁",
                emoji: "🌳",
                desc: "你的心理年龄相当成熟，像一棵经历风雨的大树。你看问题很透彻，情绪稳定，是朋友圈里的"定海神针"。但这种成熟背后，可能藏着过早背负的压力。",
                advice: "你已经很强大了，但强大不等于要扛下所有。学会向信任的人示弱，不是丢脸，而是让自己有喘息的空间。"
            },
            {
                min: 33, max: 40,
                age: "50岁+",
                emoji: "🦉",
                desc: "你的心理年龄非常资深，拥有超越年龄的智慧。你见多识广，处事不惊，是很多人心中的"人生导师"。但这可能也意味着，你比同龄人更早失去了某些天真。",
                advice: "智慧是你的财富，但不要因为看得太透而放弃了体验的乐趣。有时候，"糊涂"一点，反而能收获更多快乐。"
            }
        ];

        const footerID = "小红书 @你的账号名"; // ← 改成你的小红书ID
        // ==================== 配置区结束 ====================

        let currentQuestion = 0;
        let totalScore = 0;

        function startTest() {
            currentQuestion = 0;
            totalScore = 0;
            showPage('page-question');
            renderQuestion();
        }

        function renderQuestion() {
            const q = questions[currentQuestion];
            document.getElementById('question-num').textContent = `第 ${currentQuestion + 1} / ${questions.length} 题`;
            document.getElementById('question-text').textContent = q.text;

            const progress = ((currentQuestion) / questions.length) * 100;
            document.getElementById('progress-fill').style.width = progress + '%';

            const container = document.getElementById('options-container');
            container.innerHTML = '';
            q.options.forEach((opt, idx) => {
                const btn = document.createElement('button');
                btn.className = 'option';
                btn.textContent = opt.text;
                btn.onclick = () => selectOption(idx);
                container.appendChild(btn);
            });
        }

        function selectOption(idx) {
            const q = questions[currentQuestion];
            totalScore += q.options[idx].score;

            const opts = document.querySelectorAll('.option');
            opts[idx].classList.add('selected');

            setTimeout(() => {
                currentQuestion++;
                if (currentQuestion < questions.length) {
                    renderQuestion();
                } else {
                    showLoading();
                }
            }, 300);
        }

        function showLoading() {
            showPage('page-loading');
            setTimeout(() => {
                showResult();
            }, 2000);
        }

        function showResult() {
            const result = results.find(r => totalScore >= r.min && totalScore <= r.max);
            if (!result) {
                const last = results[results.length - 1];
                showResultPage(last);
            } else {
                showResultPage(result);
            }
        }

        function showResultPage(result) {
            document.getElementById('result-emoji').textContent = result.emoji;
            document.getElementById('result-age').textContent = result.age;
            document.getElementById('result-desc').textContent = result.desc;
            document.getElementById('result-advice').textContent = result.advice;
            document.querySelector('.footer-id').textContent = footerID;
            showPage('page-result');
        }

        function shareResult() {
            const age = document.getElementById('result-age').textContent;
            const text = `我测出来心理年龄是${age}！快来测测你的👉`;
            if (navigator.share) {
                navigator.share({
                    title: '测测你的心理年龄',
                    text: text,
                    url: window.location.href
                });
            } else {
                // 复制到剪贴板
                const input = document.createElement('input');
                input.value = text + ' ' + window.location.href;
                document.body.appendChild(input);
                input.select();
                document.execCommand('copy');
                document.body.removeChild(input);
                alert('已复制分享文案，去小红书粘贴吧！');
            }
        }

        function restartTest() {
            startTest();
        }

        function showPage(pageId) {
            document.querySelectorAll('.page').forEach(p => p.classList.remove('active'));
            document.getElementById(pageId).classList.add('active');
        }
    </script>
